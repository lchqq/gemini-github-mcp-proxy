<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Gemini Web and Gemini App share one connector to GitHub</title>
  <desc id="desc">Gemini Web and Gemini App connect to a shared connector, then to a Cloudflare Worker, GitHub Remote MCP, and the GitHub API.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1729"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .halo { fill: url(#glow); }
      .eyebrow { fill: #7dd3fc; font: 700 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; }
      .title { fill: #f8fafc; font: 700 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #94a3b8; font: 400 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #111c2f; stroke-width: 1.5; filter: url(#shadow); }
      .box-title { fill: #f8fafc; font: 700 19px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box-copy { fill: #a8b5c7; font: 400 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { fill: none; stroke: #7dd3fc; stroke-width: 2.2; marker-end: url(#arrow); }
      .edge-label { fill: #67e8f9; font: 600 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .4px; }
      .footer { fill: #94a3b8; font: 500 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="520" rx="24"/>
  <ellipse class="halo" cx="720" cy="260" rx="610" ry="225"/>
  <text class="eyebrow" x="52" y="52">GEMINI × GITHUB</text>
  <text class="title" x="52" y="92">One authorization. Two Gemini entry points.</text>
  <text class="subtitle" x="52" y="121">Gemini Web and Gemini App share the same connector while keeping GitHub credentials outside Gemini.</text>

  <rect class="box" x="60" y="160" width="220" height="88" rx="16" stroke="#60a5fa"/>
  <text class="box-title" x="170" y="196" text-anchor="middle">Gemini Web</text>
  <text class="box-copy" x="170" y="220" text-anchor="middle">desktop setup + long sessions</text>

  <rect class="box" x="60" y="330" width="220" height="88" rx="16" stroke="#34d399"/>
  <text class="box-title" x="170" y="366" text-anchor="middle">Gemini App</text>
  <text class="box-copy" x="170" y="390" text-anchor="middle">iOS / Android · separate quota</text>

  <rect class="box" x="350" y="245" width="230" height="88" rx="16" stroke="#a78bfa"/>
  <text class="box-title" x="465" y="281" text-anchor="middle">Shared Connector</text>
  <text class="box-copy" x="465" y="305" text-anchor="middle">one Google account</text>

  <rect class="box" x="650" y="245" width="240" height="88" rx="16" stroke="#fb923c"/>
  <text class="box-title" x="770" y="279" text-anchor="middle">Cloudflare Worker</text>
  <text class="box-copy" x="770" y="303" text-anchor="middle">OAuth · PAT isolation · text normalization</text>

  <rect class="box" x="960" y="245" width="250" height="88" rx="16" stroke="#22d3ee"/>
  <text class="box-title" x="1085" y="279" text-anchor="middle">GitHub Remote MCP</text>
  <text class="box-copy" x="1085" y="303" text-anchor="middle">full upstream tool surface</text>

  <rect class="box" x="1280" y="245" width="110" height="88" rx="16" stroke="#e5e7eb"/>
  <text class="box-title" x="1335" y="279" text-anchor="middle">GitHub</text>
  <text class="box-copy" x="1335" y="303" text-anchor="middle">API</text>

  <path class="arrow" d="M280 204 C314 204 314 273 350 280"/>
  <path class="arrow" d="M280 374 C314 374 314 305 350 298"/>
  <text class="edge-label" x="335" y="252" text-anchor="end">OAuth + PKCE</text>
  <path class="arrow" d="M580 289 H648"/>
  <text class="edge-label" x="615" y="277" text-anchor="middle">Bearer</text>
  <path class="arrow" d="M890 289 H958"/>
  <text class="edge-label" x="925" y="277" text-anchor="middle">PAT</text>
  <path class="arrow" d="M1210 289 H1278"/>
  <text class="edge-label" x="1244" y="277" text-anchor="middle">tools</text>

  <circle cx="52" cy="466" r="5" fill="#34d399"/>
  <text class="footer" x="68" y="471">PAT stays in Cloudflare Secrets · Gemini receives signed OAuth tokens only</text>
</svg>
